[env]
Z3_SYS_BUNDLED_DIR_OVERRIDE = { value = "vendor/z3", relative = true }
CVC5_DIR = { value = "vendor/cvc5", relative = true }
# cvc5 1.3.1 builds vendored GMP 6.3.0 for LibPoly. Newer Clang releases warn
# on GMP's old spaced user-defined literal operators, and LibPoly promotes
# warnings to errors. Keep this narrow to C++ compilation so fresh native builds
# still succeed with current toolchains.
CXXFLAGS = { value = "-Wno-error=deprecated-literal-operator", force = false }
